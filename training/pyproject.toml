[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sms-classifier-training"
version = "0.1.0"
description = "Offline SMS classifier training pipeline"
readme = "data/README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0,<2.0",
    "PyYAML>=6.0",
    "pytest>=7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
